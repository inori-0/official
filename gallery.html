<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="神無罪祈（Inori Kannatsumi）のギャラリーページです。"
    >

    <title>Gallery | Inori Kannatsumi Official Website</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >
</head>

<body>

    <!-- Header -->

    <header class="site-header">

        <div class="header-inner">

            <a
                class="site-logo"
                href="index.html"
            >
                <span class="logo-pearl"></span>

                <span>
                    Inori Kannatsumi
                </span>

                <span class="logo-pearl"></span>
            </a>

            <button
                class="menu-button"
                type="button"
                aria-label="メニューを開く"
                aria-expanded="false"
                aria-controls="global-nav"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav
                id="global-nav"
                class="global-nav"
            >
                <a href="index.html#home">
                    Home
                </a>

                <a href="index.html#profile">
                    Profile
                </a>

                <a
                    class="current"
                    href="gallery.html"
                >
                    Gallery
                </a>

                <a href="index.html#news">
                    News
                </a>

                <a href="#contact">
                    Contact
                </a>
            </nav>

        </div>

    </header>


    <main class="gallery-page">

        <section class="gallery-main-section">

            <div class="section-inner">

                <div class="section-heading gallery-page-heading">

                    <p class="section-label">
                        ARTWORKS
                    </p>

                    <h1>
                        Gallery
                    </h1>

                    <div class="heading-decoration">

                        <span class="heading-line"></span>
                        <span class="heading-pearl"></span>
                        <span class="heading-ribbon">♢</span>
                        <span class="heading-pearl"></span>
                        <span class="heading-line"></span>

                    </div>

                    <p class="gallery-description">
                        画像をクリックすると、作品情報をご覧いただけます。
                    </p>

                </div>


                <div class="gallery-full-grid">

<!-- 作品1 -->

<button
    class="gallery-full-item gallery-modal-button"
    type="button"
    data-image="images/gallery/gallery001.png"
    data-title="2025バースデー"
    data-illustrator="福山魚子様"
    aria-label="2025バースデーの作品情報を開く"
>
    <img
        src="images/gallery/gallery001.png"
        alt="2025バースデー"
        loading="lazy"
    >

    <span class="gallery-item-information">

        <span class="gallery-item-title">
            2025バースデー
        </span>

        <span class="gallery-item-illustrator">
            Illustration：福山魚子様
        </span>

    </span>
</button>


<!-- 作品2 -->

<button
    class="gallery-full-item gallery-modal-button"
    type="button"
    data-image="images/gallery/gallery002.png"
    data-title="3month記念"
    data-illustrator="福山魚子様"
    aria-label="3month記念の作品情報を開く"
>
    <img
        src="images/gallery/gallery002.png"
        alt="3month記念"
        loading="lazy"
    >

    <span class="gallery-item-information">

        <span class="gallery-item-title">
            3month記念
        </span>

        <span class="gallery-item-illustrator">
            Illustration：福山魚子様
        </span>

    </span>
</button>

                </div>


                <div class="section-button-area">

                    <a
                        class="more-button"
                        href="index.html"
                    >
                        <span>←</span>
                        トップページへ戻る
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- 画像拡大モーダル -->

    <div
        class="gallery-modal"
        id="gallery-modal"
        aria-hidden="true"
    >

        <div
            class="gallery-modal-background"
            data-modal-close
        ></div>

        <div
            class="gallery-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="gallery-modal-title"
        >

            <button
                class="gallery-modal-close"
                type="button"
                aria-label="作品情報を閉じる"
                data-modal-close
            >
                ×
            </button>

            <div class="gallery-modal-image-area">

                <img
                    id="gallery-modal-image"
                    src=""
                    alt=""
                >

            </div>

            <div class="gallery-modal-information">

                <p
                    class="gallery-modal-title"
                    id="gallery-modal-title"
                ></p>

                <p class="gallery-modal-illustrator">

                    <span>
                        Illustration
                    </span>

                    <b id="gallery-modal-illustrator"></b>

                </p>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer
        id="contact"
        class="site-footer"
    >

        <div class="footer-lace"></div>

        <div class="footer-inner">

            <p class="footer-title">
                Contact
            </p>

            <p class="footer-message">
                お問い合わせや各種ご連絡は、公式SNSよりお願いいたします。
            </p>

            <div class="footer-links">

                <a
                    href="https://www.youtube.com/@あなたのチャンネルID"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    YouTube
                </a>

                <a
                    href="https://x.com/あなたのID"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    X
                </a>

                <a
                    href="https://web.iriam.app/s/user/あなたのIRIAM-ID"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    IRIAM
                </a>

                <a
                    href="https://note.com/あなたのID"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    note
                </a>

            </div>

            <p class="copyright">
                &copy; 2026 Inori Kannatsumi. All Rights Reserved.
            </p>

        </div>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
